name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pyright Type Checker
        run: pyright src tests

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: playwright install --with-deps chromium

      - name: Install Playwright Chromium (macOS & Windows)
        if: runner.os != 'Linux'
        run: playwright install chromium

      - name: Run Pytest suite
        run: pytest -v

      - name: Display Solara screenshots in Job Summary
        if: always()
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          screenshots = sorted(Path("screenshots").glob("*.png"))

          if summary_path and screenshots:
              with open(summary_path, "a", encoding="utf-8") as f:
                  runner_os = os.environ.get("RUNNER_OS", "Unknown OS")
                  f.write(f"## Solara Screenshots ({runner_os})\n\n")
                  f.write("Visual inspection of Solara simulation interactive canvas captured in headless Chromium:\n\n")
                  for img in screenshots:
                      b64_data = base64.b64encode(img.read_bytes()).decode("utf-8")
                      f.write(f"### `{img.name}`\n\n")
                      f.write(f'<img src="data:image/png;base64,{b64_data}" width="720" alt="{img.name}" />\n\n')

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/*.png
          if-no-files-found: ignore
